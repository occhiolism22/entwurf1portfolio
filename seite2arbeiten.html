<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Arbeiten - Portfolio</title>
    <style>
        /* Ein einfaches, schönes Grunddesign für dein Portfolio */
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 50px; }
        
        /* Das Raster für deine Projektkarten */
        .projects-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }
        
        /* Styling für die Amiracles Magazin Karte */
        .project-card {
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            width: 350px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .project-card:hover {
            transform: translateY(-5px);
            background: #2a2a2a;
        }
        .project-card h2 { margin-top: 0; color: #fff; }
        .project-tag { font-size: 0.85rem; color: #888; text-transform: uppercase; margin-bottom: 15px; }
        .project-year { float: right; color: #555; }
        .project-text { color: #ccc; font-size: 0.95rem; line-height: 1.5; }

        /* Magazin Container Zentrierung */
        .flipbook-section {
            display: none; /* Wird erst beim Klick sichtbar */
            text-align: center;
            margin: 60px auto;
            max-width: 900px;
        }
    </style>
</head>
<body>

    <h1>Meine Arbeiten</h1>

    <!-- PROJEKT LISTE ANZEIGE -->
    <div class="projects-grid" id="projects-container">
        <!-- Hier baut JavaScript automatisch deine Projektkarte ein -->
    </div>

    <!-- INTERAKTIVES FLIPBOOK (Wird erst beim Klick auf die Karte eingeblendet) -->
    <div id="magazin-container" class="flipbook-section">
        <h3 style="color: #fff; margin-bottom: 25px; font-size: 1.5rem;">Amiracles Magazin (Interaktives Flipbook)</h3>
        <div id="flipbook" style="margin: 0 auto; width: 800px; height: 500px;"></div>
    </div>

    <!-- TURN.JS BIBLIOTHEKEN & JQUERY (Automatisch über Server geladen) -->
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        // 1. DEINE PROJEKT-DATEN (Das PROJECTS Array)
        var PROJECTS = [
            {
                title: "Amiracles Magazin",
                kind: "Editorial Design", 
                year: "2025",
                text: "Wir sollten für den Typografiekurs ein Magazin erstellen und alle unsere Arbeiten einbetten. Da ich mich während meinen Hausaufgaben eh auf Musik fokussiert habe, habe ich ein Musikmagazin erstellt.",
                media: { youtube: "" },
                action: function() { starteFlipbook(); } // Führt die Flipbook-Funktion aus!
            }
        ];

        // 2. BLÄTTER-SOUND INITIALISIEREN
        const pageFlipSound = new Audio('https://soundjay.com');

        // 3. PROJEKTKARTEN AUTOMATISCH AUF DEM BILDSCHIRM BAUEN
        \$(document).ready(function() {
            const container = \$('#projects-container');
            
            PROJECTS.forEach(function(projekt) {
                // Erstellt das HTML für deine Karte
                let cardHtml = `
                    <div class="project-card" id="card-magazin">
                        <span class="project-year">${projekt.year}</span>
                        <div class="project-tag">${projekt.kind}</div>
                        <h2>${projekt.title}</h2>
                        <p class="project-text">${projekt.text}</p>
                    </div>
                `;
                container.append(cardHtml);
                
                // Aktiviert den Klick-Befehl auf der Karte
                \$('#card-magazin').on('click', function() {
                    if (typeof projekt.action === 'function') {
                        projekt.action();
                    }
                });
            });
        });

        // 4. DIE FLIPBOOK FUNKTION (Baut deine 38 Seiten vollautomatisch auf)
        function starteFlipbook() {
            const totalPages = 38; // Genau für deine 38 hochgeladenen JPGs
            const flipbookContainer = \$('#flipbook');
            
            // Verhindert, dass die Seiten bei jedem Klick doppelt generiert werden
            if (flipbookContainer.children().length === 0) {
                for (let i = 1; i <= totalPages; i++) {
                    // Macht aus der Zahl 1 -> '0001', aus 38 -> '0038'
                    let pageNumber = String(i).padStart(4, '0');
                    let imageUrl = `AMIRACLES MAGAZIN N°1_page-${pageNumber}.jpg`;
                    
                    // Erstellt das Element für die aktuelle Seite
                    let pageHtml = `<div style="background-image:url('${imageUrl}'); background-size: 100% 100%;"></div>`;
                    flipbookContainer.append(pageHtml);
                }

                // Initialisiert das Flipbook-Plugin mit Knick-Effekt
                flipbookContainer.turn({
                    width: 800,
                    height: 500,
                    autoCenter: true,
                    duration: 1000, // Geschwindigkeit des Umblätterns in Millisekunden
                    when: {
                        turning: function(event, page, view) {
                            // Spielt den Sound ab, sobald eine Seite umknickt
                            pageFlipSound.currentTime = 0;
                            pageFlipSound.play().catch(e => console.log("Sound aktiv nach dem ersten Klick"));
                        }
                    }
                });
            }
            
            // Blendet das fertige Magazin sanft ein
            \$('#magazin-container').fadeIn();
            
            // Scrollt den Bildschirm automatisch gemütlich runter zum Magazin
            \$('html, body').animate({
                scrollTop: \$("#magazin-container").offset().top - 20
            }, 600);
        }
    </script>

</body>
</html>
